<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll sequence — demo</title>
    <style>
      :root { --si-bg: #0a0a0a; --si-ink: #ffffff; }
      html, body { margin: 0; background: #0a0a0a; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
      .copy { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 0 8vw; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0; }
    </style>
  </head>
  <body>
    <section class="copy"><h1>Scroll para reproducir</h1></section>
    <div id="hero"></div>
    <section class="copy"><h1>Fin de la secuencia</h1></section>

    <script src="./scrub-image-sequence.js"></script>
    <script>
      mountImageSequence(document.getElementById("hero"), {
        frameCount: 120,
        frameSrc: (i) => `./frames/frame-${String(i + 1).padStart(4, "0")}.webp`,
        travel: 3,
        hint: "scroll",
      });
    </script>
  </body>
</html>
